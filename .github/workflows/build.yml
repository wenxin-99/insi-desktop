name: Build & Release Insi Desktop

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Configure updater artifacts
        run: node .github/scripts/prepare-updater.mjs
      - name: Build Windows installer
        run: npx tauri build --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  build-mac-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Configure updater artifacts
        run: node .github/scripts/prepare-updater.mjs
      - name: Build macOS Apple Silicon installer
        run: npx tauri build --target aarch64-apple-darwin --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Configure updater artifacts
        run: node .github/scripts/prepare-updater.mjs
      - name: Build macOS Intel installer
        run: npx tauri build --target x86_64-apple-darwin --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libegl1-mesa-dev
      - run: npm install
      - name: Configure updater artifacts
        run: node .github/scripts/prepare-updater.mjs
      - name: Build Linux installers
        run: npx tauri build --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  release:
    needs: [build-windows, build-mac-aarch64, build-mac-x64, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4

      - name: Inventory downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          find windows-x64 macos-aarch64 macos-x64 linux-x64 \
            -type f -printf '%p\n' | sort

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          collect_required() {
            local platform="$1"
            shift
            local matched=0
            local pattern
            local file

            for pattern in "$@"; do
              while IFS= read -r -d '' file; do
                cp "$file" "release-assets/${platform}-$(basename "$file")"
                matched=1
              done < <(find "$platform" -type f -name "$pattern" -print0)
            done

            if [[ "$matched" -ne 1 ]]; then
              echo "::error::No releasable installer found for ${platform}."
              find "$platform" -type f -printf '%p\n' | sort || true
              exit 1
            fi
          }

          collect_optional() {
            local platform="$1"
            shift
            local pattern
            local file

            for pattern in "$@"; do
              while IFS= read -r -d '' file; do
                cp "$file" "release-assets/${platform}-$(basename "$file")"
              done < <(find "$platform" -type f -name "$pattern" -print0)
            done
          }

          collect_required windows-x64 '*.exe'
          collect_required macos-aarch64 '*.dmg' '*.app.tar.gz'
          collect_required macos-x64 '*.dmg' '*.app.tar.gz'
          collect_required linux-x64 '*.deb' '*.AppImage'

          collect_optional windows-x64 '*.exe.sig'
          collect_optional macos-aarch64 '*.app.tar.gz.sig'
          collect_optional macos-x64 '*.app.tar.gz.sig'
          collect_optional linux-x64 '*.AppImage.sig'

          echo 'Release assets:'
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Detect signed updater artifacts
        id: updater
        shell: bash
        run: |
          set -euo pipefail

          first_match() {
            find "$1" -type f -name "$2" -print -quit
          }

          WIN_INSTALLER=$(first_match windows-x64 '*.exe')
          WIN_SIGNATURE=$(first_match windows-x64 '*.exe.sig')
          MAC_ARM_INSTALLER=$(first_match macos-aarch64 '*.app.tar.gz')
          MAC_ARM_SIGNATURE=$(first_match macos-aarch64 '*.app.tar.gz.sig')
          MAC_X64_INSTALLER=$(first_match macos-x64 '*.app.tar.gz')
          MAC_X64_SIGNATURE=$(first_match macos-x64 '*.app.tar.gz.sig')
          LINUX_INSTALLER=$(first_match linux-x64 '*.AppImage')
          LINUX_SIGNATURE=$(first_match linux-x64 '*.AppImage.sig')

          if [[ -n "$WIN_INSTALLER" && -n "$WIN_SIGNATURE" \
            && -n "$MAC_ARM_INSTALLER" && -n "$MAC_ARM_SIGNATURE" \
            && -n "$MAC_X64_INSTALLER" && -n "$MAC_X64_SIGNATURE" \
            && -n "$LINUX_INSTALLER" && -n "$LINUX_SIGNATURE" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Signed updater artifacts detected.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Signed updater artifacts are incomplete. Publishing platform installers without update-manifest.json.'
          fi

      - name: Generate updater manifest
        if: steps.updater.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="Insi Desktop v${VERSION}"

          first_match() {
            find "$1" -type f -name "$2" -print -quit
          }

          WIN_SOURCE=$(first_match windows-x64 '*.exe')
          WIN_SIG_SOURCE=$(first_match windows-x64 '*.exe.sig')
          MAC_ARM_SOURCE=$(first_match macos-aarch64 '*.app.tar.gz')
          MAC_ARM_SIG_SOURCE=$(first_match macos-aarch64 '*.app.tar.gz.sig')
          MAC_X64_SOURCE=$(first_match macos-x64 '*.app.tar.gz')
          MAC_X64_SIG_SOURCE=$(first_match macos-x64 '*.app.tar.gz.sig')
          LINUX_SOURCE=$(first_match linux-x64 '*.AppImage')
          LINUX_SIG_SOURCE=$(first_match linux-x64 '*.AppImage.sig')

          WIN_SIG=$(cat "$WIN_SIG_SOURCE")
          MAC_ARM_SIG=$(cat "$MAC_ARM_SIG_SOURCE")
          MAC_X64_SIG=$(cat "$MAC_X64_SIG_SOURCE")
          LINUX_SIG=$(cat "$LINUX_SIG_SOURCE")

          WIN_FILE="windows-x64-$(basename "$WIN_SOURCE")"
          MAC_ARM_FILE="macos-aarch64-$(basename "$MAC_ARM_SOURCE")"
          MAC_X64_FILE="macos-x64-$(basename "$MAC_X64_SOURCE")"
          LINUX_FILE="linux-x64-$(basename "$LINUX_SOURCE")"

          test -f "release-assets/$WIN_FILE"
          test -f "release-assets/$MAC_ARM_FILE"
          test -f "release-assets/$MAC_X64_FILE"
          test -f "release-assets/$LINUX_FILE"

          export VERSION BASE_URL DATE NOTES
          export WIN_SIG MAC_ARM_SIG MAC_X64_SIG LINUX_SIG
          export WIN_FILE MAC_ARM_FILE MAC_X64_FILE LINUX_FILE

          python3 - <<'PY'
          import json
          import os

          base_url = os.environ['BASE_URL']
          data = {
              'version': os.environ['VERSION'],
              'notes': os.environ['NOTES'],
              'pub_date': os.environ['DATE'],
              'platforms': {
                  'windows-x86_64': {
                      'signature': os.environ['WIN_SIG'],
                      'url': f"{base_url}/{os.environ['WIN_FILE']}",
                  },
                  'darwin-aarch64': {
                      'signature': os.environ['MAC_ARM_SIG'],
                      'url': f"{base_url}/{os.environ['MAC_ARM_FILE']}",
                  },
                  'darwin-x86_64': {
                      'signature': os.environ['MAC_X64_SIG'],
                      'url': f"{base_url}/{os.environ['MAC_X64_FILE']}",
                  },
                  'linux-x86_64': {
                      'signature': os.environ['LINUX_SIG'],
                      'url': f"{base_url}/{os.environ['LINUX_FILE']}",
                  },
              },
          }
          with open('update-manifest.json', 'w', encoding='utf-8') as file:
              json.dump(data, file, ensure_ascii=False, indent=2)
          PY

          python3 -m json.tool update-manifest.json >/dev/null
          cat update-manifest.json

      - name: Publish signed release
        if: steps.updater.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
            update-manifest.json

      - name: Publish installer-only release
        if: steps.updater.outputs.enabled != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
