name: Build & Release Insi Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  build-mac-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npx tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npx tauri build --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - run: npm install
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

  release:
    needs: [build-windows, build-mac-aarch64, build-mac-x64, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4

      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="Insi Desktop v${VERSION}"

          WIN_SIG=$(cat windows-x64/*.exe.sig)
          MAC_ARM_SIG=$(cat macos-aarch64/*.app.tar.gz.sig)
          MAC_X64_SIG=$(cat macos-x64/*.app.tar.gz.sig)
          LINUX_SIG=$(cat linux-x64/*.AppImage.tar.gz.sig)

          WIN_FILE=$(find windows-x64 -maxdepth 1 -type f -name '*.exe' ! -name '*.sig' -printf '%f\n' | head -1)
          MAC_ARM_FILE=$(find macos-aarch64 -maxdepth 1 -type f -name '*.app.tar.gz' -printf '%f\n' | head -1)
          MAC_X64_FILE=$(find macos-x64 -maxdepth 1 -type f -name '*.app.tar.gz' -printf '%f\n' | head -1)
          LINUX_FILE=$(find linux-x64 -maxdepth 1 -type f -name '*.AppImage.tar.gz' -printf '%f\n' | head -1)

          test -n "$WIN_SIG" && test -n "$MAC_ARM_SIG" && test -n "$MAC_X64_SIG" && test -n "$LINUX_SIG"
          test -n "$WIN_FILE" && test -n "$MAC_ARM_FILE" && test -n "$MAC_X64_FILE" && test -n "$LINUX_FILE"

          export VERSION BASE_URL DATE NOTES
          export WIN_SIG MAC_ARM_SIG MAC_X64_SIG LINUX_SIG
          export WIN_FILE MAC_ARM_FILE MAC_X64_FILE LINUX_FILE

          python3 - <<'PY'
          import json
          import os

          base_url = os.environ['BASE_URL']
          data = {
              'version': os.environ['VERSION'],
              'notes': os.environ['NOTES'],
              'pub_date': os.environ['DATE'],
              'platforms': {
                  'windows-x86_64': {
                      'signature': os.environ['WIN_SIG'],
                      'url': f"{base_url}/{os.environ['WIN_FILE']}",
                  },
                  'darwin-aarch64': {
                      'signature': os.environ['MAC_ARM_SIG'],
                      'url': f"{base_url}/{os.environ['MAC_ARM_FILE']}",
                  },
                  'darwin-x86_64': {
                      'signature': os.environ['MAC_X64_SIG'],
                      'url': f"{base_url}/{os.environ['MAC_X64_FILE']}",
                  },
                  'linux-x86_64': {
                      'signature': os.environ['LINUX_SIG'],
                      'url': f"{base_url}/{os.environ['LINUX_FILE']}",
                  },
              },
          }
          with open('update-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

          python3 -m json.tool update-manifest.json >/dev/null
          cat update-manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows-x64/*.exe
            macos-aarch64/*.dmg
            macos-aarch64/*.app.tar.gz
            macos-x64/*.dmg
            macos-x64/*.app.tar.gz
            linux-x64/*.deb
            linux-x64/*.AppImage
            update-manifest.json
