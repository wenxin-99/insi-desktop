name: Diagnose Desktop Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-diagnose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Build and capture log
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --verbose 2>&1 | tee build.log
          echo "${PIPESTATUS[0]}" > build-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-windows-log
          path: |
            build.log
            build-exit.txt
          if-no-files-found: error
      - name: Restore build result
        shell: bash
        run: exit "$(cat build-exit.txt)"

  build-mac-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Build and capture log
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --target aarch64-apple-darwin --verbose 2>&1 | tee build.log
          echo "${PIPESTATUS[0]}" > build-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-mac-aarch64-log
          path: |
            build.log
            build-exit.txt
          if-no-files-found: error
      - name: Restore build result
        shell: bash
        run: exit "$(cat build-exit.txt)"

  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Build and capture log
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --target x86_64-apple-darwin --verbose 2>&1 | tee build.log
          echo "${PIPESTATUS[0]}" > build-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-mac-x64-log
          path: |
            build.log
            build-exit.txt
          if-no-files-found: error
      - name: Restore build result
        shell: bash
        run: exit "$(cat build-exit.txt)"

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libegl1-mesa-dev
      - run: npm install
      - name: Build and capture log
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --verbose 2>&1 | tee build.log
          echo "${PIPESTATUS[0]}" > build-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-linux-log
          path: |
            build.log
            build-exit.txt
          if-no-files-found: error
      - name: Restore build result
        shell: bash
        run: exit "$(cat build-exit.txt)"
