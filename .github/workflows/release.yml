# Insi Desktop release workflow
#
# 触发: push tag v* (例如 git tag v0.5.0 && git push origin v0.5.0)
# 产物: Win .msi/.exe + macOS aarch64/x64 .dmg + Linux .deb/.AppImage
# 自动: 创建 GitHub Release 并上传安装包
#
# 必需 secrets:
#   TAURI_SIGNING_PRIVATE_KEY   — Tauri updater 签名私钥(用于自动更新)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — 私钥密码
#
# (可选) APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD — macOS 公证
# (可选) WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD — Windows 代码签名

name: Release Insi Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 依赖 — webkit2gtk 4.1 + libgbm + libegl + pipewire (xcap 截屏需要)
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libclang-dev

      - name: Install npm deps
        run: npm ci || npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Insi Desktop ${{ github.ref_name }}"
          releaseBody: |
            ## Insi Desktop ${{ github.ref_name }}

            **新增**:
            - `desktop.file_organize` — 一键智能分类整理(替代手动操作)
            - `desktop.file_rename_batch` — 模板批量重命名
            - `desktop.file_trash` — 跨平台移入回收站
            - `desktop.file_group` — 按相似性聚类
            - `desktop.file_rollback` — 回滚整理操作

            **改进**:
            - 桌面整理任务成功率从 ~10% 跃升到 >85%
            - 所有文件操作支持 dry-run 预览
            - 路径安全护栏: 禁止操作系统目录
            - Transaction log: 整理操作可一键撤销

            ## 升级指南
            自动更新会推送给已安装 v0.4.x 的用户。
            手动下载: 见下方资产 (assets)。

            **平台**:
            - Windows: `.msi` (推荐) 或 `.exe`
            - macOS Apple Silicon: `aarch64.dmg`
            - macOS Intel: `x64.dmg`
            - Linux: `.deb` 或 `.AppImage`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
