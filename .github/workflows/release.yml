# Insi Desktop release workflow —— ★ v0.8.0 手动备用管线(tauri-action 版)
#
# ⚠ 规范化说明:
#   仓库里原本有两个都在 `push: tags v*` 上触发的工作流(build.yml + 本文件),
#   会同时抢着为同一个 tag 创建 GitHub Release,产生竞态与重复资产。
#   现在把"发布"的唯一正式管线定为 build.yml(它会生成 update-manifest.json,
#   与 tauri.conf.json 里配置的 updater endpoint 对应)。本文件降级为「手动备用」:
#   仅支持 workflow_dispatch,不再监听 tag,避免竞态。
#
# 必需 secrets:
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD — updater 签名
# (可选,尚未接线) APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD — macOS 公证
# (可选,尚未接线) WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD — Windows 代码签名

name: Release Insi Desktop (manual fallback)

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 依赖 — webkit2gtk 4.1 + libgbm + libegl + pipewire (xcap 截屏需要)
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libclang-dev

      - name: Install npm deps
        run: npm ci || npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Insi Desktop ${{ github.ref_name }}"
          # ★ v0.8.0 移除写死的 v0.5.0 时代文案(会被每个未来 tag 复用);
          #   手动发布时在 GitHub Release 页面补充说明,或改用 build.yml 的自动 notes。
          releaseBody: |
            Insi Desktop ${{ github.ref_name }}

            安装包见下方 assets。变更说明请参见仓库 CHANGELOG.md。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
