<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #1a1a1a; }
.header { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 8px; }
.header img { width: 24px; height: 24px; border-radius: 6px; }
.header h1 { font-size: 14px; font-weight: 600; }
.header .badge { font-size: 10px; background: #e8f5e9; color: #2e7d32; padding: 1px 6px; border-radius: 8px; }

.section { padding: 12px 16px; }
.site-info { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 12px; }
.site-info .favicon { width: 20px; height: 20px; border-radius: 4px; background: #e0e0e0; }
.site-info .domain { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-info .count { font-size: 11px; color: #888; white-space: nowrap; }

.config { margin-bottom: 12px; }
.config label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; }
.config input { width: 100%; padding: 7px 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 12px; outline: none; }
.config input:focus { border-color: #1976d2; }
.config .row { display: flex; gap: 8px; align-items: center; }
.config .row input { flex: 1; }
.config .save-btn { padding: 7px 12px; background: none; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 11px; cursor: pointer; white-space: nowrap; }
.config .save-btn:hover { background: #f5f5f5; }

.actions { display: flex; flex-direction: column; gap: 8px; }
.btn { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: #1976d2; color: #fff; }
.btn-primary:hover { background: #1565c0; }
.btn-primary:disabled { background: #bbb; cursor: not-allowed; }
.btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #e0e0e0; }
.btn-secondary:hover { background: #eee; }

.status { font-size: 11px; text-align: center; padding: 6px; border-radius: 6px; margin-top: 8px; }
.status.success { background: #e8f5e9; color: #2e7d32; }
.status.error { background: #fce4ec; color: #c62828; }
.status.info { background: #e3f2fd; color: #1565c0; }

.footer { padding: 8px 16px; border-top: 1px solid #f0f0f0; text-align: center; }
.footer a { font-size: 10px; color: #aaa; text-decoration: none; }
.footer a:hover { color: #666; }

.accounts { margin-top: 8px; }
.account-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #f8f9fa; border-radius: 6px; margin-bottom: 4px; font-size: 11px; }
.account-item .name { flex: 1; font-weight: 500; }
.account-item .status-dot { width: 6px; height: 6px; border-radius: 50%; }
.account-item .status-dot.active { background: #4caf50; }
.account-item .status-dot.stale { background: #ff9800; }
</style>
</head>
<body>
  <div class="header">
    <div style="width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#1976d2,#42a5f5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;">I</div>
    <h1>Insi Cookie Sync</h1>
    <span class="badge" id="version">v1.0</span>
  </div>

  <div class="section">
    <div class="site-info">
      <img class="favicon" id="favicon" src="" onerror="this.style.display='none'">
      <span class="domain" id="domain">加载中...</span>
      <span class="count" id="cookieCount">-</span>
    </div>

    <div class="config">
      <label>Insi 服务器地址</label>
      <div class="row">
        <input id="serverUrl" placeholder="https://your-insi-domain.com" />
        <button class="save-btn" id="saveConfig">保存</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="syncBtn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
        同步到 Insi
      </button>
      <button class="btn btn-secondary" id="copyBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        复制 Cookie JSON
      </button>
    </div>

    <div id="statusMsg" class="status" style="display:none"></div>

    <div class="accounts" id="accountList" style="display:none">
      <label style="font-size:11px;color:#888;margin-bottom:4px;display:block;">匹配的 Insi 站点账号：</label>
      <div id="accountItems"></div>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="helpLink">使用帮助</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
