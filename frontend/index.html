<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insi Desktop Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6fa; --card: #ffffff; --border: #e2e5ef; --text: #1a1d2e;
      --text-sec: #6b7280; --primary: #3b5bfe; --primary-h: #2d4adb;
      --success: #10b981; --warn: #f59e0b; --danger: #ef4444;
      --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    html, body {
      height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px; color: var(--text); background: var(--bg);
      -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; padding: 20px; }
    .brand { text-align: center; padding: 8px 0 18px; }
    .brand-icon {
      width: 48px; height: 48px; margin: 0 auto 10px;
      background: linear-gradient(135deg, #3b5bfe, #6366f1); border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(59,91,254,.3);
    }
    .brand-icon svg { width: 26px; height: 26px; }
    .brand h1 { font-size: 18px; font-weight: 700; }
    .brand p { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input {
      width: 100%; height: 42px; padding: 0 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; color: var(--text); background: #fafbfc;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,91,254,.12); background: #fff; }
    .form-group input::placeholder { color: #b0b5c3; }
    .form-group input:disabled { opacity: .55; cursor: not-allowed; }
    .btn {
      width: 100%; height: 42px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-h); }
    .btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
    .btn-outline:hover:not(:disabled) { background: #f3f4f6; }
    .btn-danger { background: transparent; color: var(--danger); border: 1.5px solid rgba(239,68,68,.25); }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,.06); }
    .btn-sm { height: 34px; font-size: 13px; }
    .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; line-height: 1.4; }
    .alert.show { display: block; }
    .alert-error { background: rgba(239,68,68,.08); color: #b91c1c; border: 1px solid rgba(239,68,68,.15); }
    .alert-success { background: rgba(16,185,129,.08); color: #047857; border: 1px solid rgba(16,185,129,.15); }
    .divider { display: flex; align-items: center; margin: 16px 0; gap: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: 12px; color: var(--text-sec); }
    .status-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 8px rgba(16,185,129,.45); }
    .status-dot.connecting { background: var(--warn); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status-label { font-size: 15px; font-weight: 600; }
    .status-sub { font-size: 12px; color: var(--text-sec); }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .info-item { padding: 10px 12px; background: #f8f9fc; border-radius: 8px; border: 1px solid var(--border); }
    .info-item .label { font-size: 11px; color: var(--text-sec); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
    .info-item .value { font-size: 13px; font-weight: 600; }
    .user-badge { display: flex; align-items: center; gap: 10px; padding: 12px; background: linear-gradient(135deg, #f0f4ff, #ede9fe); border-radius: 10px; margin-bottom: 16px; }
    .user-avatar { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }
    .user-name { font-weight: 600; font-size: 14px; }
    .user-id { font-size: 11px; color: var(--text-sec); }
    .footer { margin-top: auto; padding-top: 12px; }
    .footer-links { display: flex; justify-content: center; gap: 16px; margin-top: 12px; }
    .footer-links a { font-size: 12px; color: var(--primary); text-decoration: none; cursor: pointer; }
    .footer-links a:hover { text-decoration: underline; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .view { display: none; flex-direction: column; flex: 1; }
    .view.active { display: flex; }
    .version-text { text-align: center; font-size: 11px; color: #c0c5d0; padding-top: 10px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <h1>Insi Desktop</h1>
      <p>AI 桌面控制代理</p>
    </div>
    <div class="card">
      <div id="loginView" class="view active">
        <div id="alertBox" class="alert"></div>
        <div class="form-group">
          <label for="username">用户名或邮箱</label>
          <input type="text" id="username" placeholder="请输入用户名或邮箱" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
          <span id="loginText">登 录</span>
        </button>
        <div class="divider"><span>其他方式</span></div>
        <button class="btn btn-outline" onclick="openGitHubLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          GitHub 登录
        </button>
        <div class="footer">
          <div class="footer-links">
            <a onclick="openExternal('https://mpsboring.com/register')">注册账号</a>
            <a onclick="openExternal('https://insights.ren')">访问网页版</a>
          </div>
        </div>
      </div>
      <div id="statusView" class="view">
        <div id="userBadge" class="user-badge" style="display:none;">
          <div class="user-avatar" id="userAvatar">U</div>
          <div><div class="user-name" id="userName">用户</div><div class="user-id" id="userIdText"></div></div>
        </div>
        <div class="status-header">
          <div class="status-dot" id="statusDot"></div>
          <div><div class="status-label" id="statusLabel">未连接</div><div class="status-sub" id="statusSub">等待连接...</div></div>
        </div>
        <div class="info-grid">
          <div class="info-item"><div class="label">系统</div><div class="value" id="infoPlatform">—</div></div>
          <div class="info-item"><div class="label">分辨率</div><div class="value" id="infoScreen">—</div></div>
          <div class="info-item"><div class="label">客户端</div><div class="value" id="infoVersion">—</div></div>
          <div class="info-item"><div class="label">权限</div><div class="value" id="infoAuth">未授权</div></div>
        </div>
        <div class="footer">
          <button class="btn btn-danger btn-sm" onclick="handleDisconnect()">断开连接并退出登录</button>
          <div class="footer-links"><a onclick="openExternal('https://insights.ren')">访问网页版</a></div>
        </div>
      </div>
    </div>
    <div class="version-text">Insi Desktop v0.3.3</div>
  </div>
  <script>
    var SERVER = 'https://insights.ren';
    async function invoke(cmd, args) {
      var t = window.__TAURI_INTERNALS__;
      if (!t || !t.invoke) return null;
      return t.invoke(cmd, args || {});
    }
    function openExternal(url) {
      invoke('plugin:shell|open', { path: url }).catch(function() { window.open(url, '_blank'); });
    }
    function showView(id) {
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }
    function showAlert(msg, type) {
      var el = document.getElementById('alertBox');
      el.textContent = msg; el.className = 'alert show alert-' + type;
    }
    function hideAlert() { document.getElementById('alertBox').className = 'alert'; }

    async function handleLogin() {
      hideAlert();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value.trim();
      if (!username || !password) { showAlert('请输入用户名和密码', 'error'); return; }
      var btn = document.getElementById('loginBtn');
      var textEl = document.getElementById('loginText');
      btn.disabled = true;
      textEl.innerHTML = '<span class="spinner"></span> 登录中...';
      try {
        var res = await fetch(SERVER + '/api/forum/password-login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password }),
        });
        var data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('auth_token', data.token);
          if (data.user) localStorage.setItem('user_info', JSON.stringify(data.user));
          showAlert('登录成功，正在连接...', 'success');
          await invoke('login', { token: data.token });
          setTimeout(function() { switchToStatus(); }, 800);
        } else {
          showAlert(data.message || '登录失败，请检查用户名和密码', 'error');
        }
      } catch (err) {
        showAlert('网络错误，请检查网络连接后重试', 'error');
      } finally {
        btn.disabled = false; textEl.textContent = '登 录';
      }
    }
    function openGitHubLogin() { openExternal(SERVER + '/api/github/login'); }
    function switchToStatus() { showView('statusView'); renderUserBadge(); pollStatus(); }
    function renderUserBadge() {
      try {
        var raw = localStorage.getItem('user_info');
        if (raw) {
          var user = JSON.parse(raw);
          var name = user.username || user.name || '用户';
          document.getElementById('userName').textContent = name;
          document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
          document.getElementById('userIdText').textContent = user.email || '';
          document.getElementById('userBadge').style.display = 'flex';
        }
      } catch(e) {}
    }
    var statusTimer = null;
    async function pollStatus() {
      if (statusTimer) clearInterval(statusTimer);
      async function update() {
        try {
          var s = await invoke('get_status');
          if (!s) return;
          var dot = document.getElementById('statusDot');
          var label = document.getElementById('statusLabel');
          var sub = document.getElementById('statusSub');
          var map = {
            'Connected': { cls: 'connected', text: '已连接', sub: '服务端通信正常' },
            'Connecting': { cls: 'connecting', text: '连接中...', sub: '正在建立连接' },
            'Reconnecting': { cls: 'connecting', text: '重连中...', sub: '连接断开，尝试重连' },
            'Disconnected': { cls: '', text: '未连接', sub: '等待连接...' },
          };
          var st = map[s.status] || map['Disconnected'];
          dot.className = 'status-dot ' + st.cls;
          label.textContent = st.text;
          sub.textContent = st.sub;
          var pn = { windows: 'Windows', macos: 'macOS', linux: 'Linux' };
          document.getElementById('infoPlatform').textContent = pn[s.platform] || s.platform || '—';
          document.getElementById('infoVersion').textContent = 'v' + (s.clientVersion || '?');
          document.getElementById('infoAuth').textContent = s.authorized ? '已授权' : '未授权';
          document.getElementById('infoAuth').style.color = s.authorized ? 'var(--success)' : 'var(--warn)';
          if (s.screen) {
            document.getElementById('infoScreen').textContent = s.screen.width + '×' + s.screen.height + (s.screen.scale > 1 ? ' @' + s.screen.scale + 'x' : '');
          }
        } catch (err) {}
      }
      await update();
      statusTimer = setInterval(update, 3000);
    }
    async function handleDisconnect() {
      await invoke('disconnect');
      localStorage.removeItem('auth_token'); localStorage.removeItem('user_info');
      if (statusTimer) clearInterval(statusTimer);
      hideAlert();
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      showView('loginView');
    }
    async function tryAutoLogin() {
      var token = localStorage.getItem('auth_token');
      if (!token) return;
      try {
        var res = await fetch(SERVER + '/api/trpc/auth.me', { headers: { 'Authorization': 'Bearer ' + token } });
        var data = await res.json();
        var user = data && data.result && data.result.data && data.result.data.json;
        if (user && user.id) {
          localStorage.setItem('user_info', JSON.stringify(user));
          await invoke('login', { token: token });
          switchToStatus();
        } else { localStorage.removeItem('auth_token'); localStorage.removeItem('user_info'); }
      } catch (e) {
        await invoke('login', { token: token });
        switchToStatus();
      }
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && document.getElementById('loginView').classList.contains('active')) handleLogin();
    });
    window.addEventListener('DOMContentLoaded', function() { tryAutoLogin(); });
  </script>
</body>
</html>
