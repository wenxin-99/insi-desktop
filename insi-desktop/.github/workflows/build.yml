name: Build & Release Insi Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  build-mac-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tauri build --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm install
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

  release:
    needs: [build-windows, build-mac-aarch64, build-mac-x64, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4

      - name: Generate updater manifest
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="Insi Desktop v${VERSION}"

          # Read signatures (use ls to handle globs)
          WIN_SIG=$(cat windows-x64/*.exe.sig 2>/dev/null || echo "")
          MAC_ARM_SIG=$(cat macos-aarch64/*.app.tar.gz.sig 2>/dev/null || echo "")
          MAC_X64_SIG=$(cat macos-x64/*.app.tar.gz.sig 2>/dev/null || echo "")
          LINUX_SIG=$(cat linux-x64/*.AppImage.tar.gz.sig 2>/dev/null || echo "")

          # Find actual filenames
          WIN_FILE=$(ls windows-x64/*.exe 2>/dev/null | grep -v '.sig$' | head -1 | xargs basename 2>/dev/null || echo "")
          MAC_ARM_FILE=$(ls macos-aarch64/*.app.tar.gz 2>/dev/null | grep -v '.sig$' | head -1 | xargs basename 2>/dev/null || echo "")
          MAC_X64_FILE=$(ls macos-x64/*.app.tar.gz 2>/dev/null | grep -v '.sig$' | head -1 | xargs basename 2>/dev/null || echo "")
          LINUX_FILE=$(ls linux-x64/*.AppImage.tar.gz 2>/dev/null | grep -v '.sig$' | head -1 | xargs basename 2>/dev/null || echo "")

          cat > update-manifest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": { "signature": "${WIN_SIG}", "url": "${BASE_URL}/${WIN_FILE}" },
              "darwin-aarch64": { "signature": "${MAC_ARM_SIG}", "url": "${BASE_URL}/${MAC_ARM_FILE}" },
              "darwin-x86_64": { "signature": "${MAC_X64_SIG}", "url": "${BASE_URL}/${MAC_X64_FILE}" },
              "linux-x86_64": { "signature": "${LINUX_SIG}", "url": "${BASE_URL}/${LINUX_FILE}" }
            }
          }
          EOF

          # Remove leading whitespace from heredoc
          python3 -c "
          import json, sys
          with open('update-manifest.json') as f:
              data = json.load(f)
          with open('update-manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          cat update-manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows-x64/*.exe
            macos-aarch64/*.dmg
            macos-aarch64/*.app.tar.gz
            macos-x64/*.dmg
            macos-x64/*.app.tar.gz
            linux-x64/*.deb
            linux-x64/*.AppImage
            update-manifest.json
