<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>离线中 - Paper Insights</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #333;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 360px;
    }
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #0891b2);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.25);
    }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 24px; }
    button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 12px;
      background: linear-gradient(to right, #2563eb, #0891b2);
      color: white; font-size: 15px; font-weight: 600;
      border: none; cursor: pointer;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2); }
    .hint { font-size: 13px; color: #999; margin-top: 16px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      p { color: #aaa; }
      .hint { color: #666; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>网络连接已断开</h1>
    <p>请检查您的 Wi-Fi 或移动数据连接，然后重试。</p>
    <button onclick="window.location.reload()">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      重新连接
    </button>
    <div class="hint">恢复连接后将自动刷新</div>
  </div>
  <script>
    // 网络恢复时自动刷新
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
